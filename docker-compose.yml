services:
  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mail_testing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mail_testing
      POSTGRES_USER: mail_user
      POSTGRES_PASSWORD: mail_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail_user -d mail_testing"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (NestJS API + IMAP Worker) ─────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mail_testing_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://mail_user:mail_pass@postgres:5432/mail_testing?schema=public
      PORT: 3000
      # Override mail domain config here (or set in backend/.env):
      # MAIL_DOMAIN: example.com
      # MAIL_BASE_ADDRESS: inbox
    ports:
      - "3000:3000"
    volumes:
      - attachments_data:/app/uploads/attachments
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Nginx serving React build) ───────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
        VITE_WS_URL: http://localhost:3000
    container_name: mail_testing_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  attachments_data:
