<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe" /> <!-- tailwind blue-100 -->
      <stop offset="100%" stop-color="#60a5fa" /> <!-- tailwind blue-400 -->
    </linearGradient>
    <linearGradient id="hoopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="100%" stop-color="#fbc02d" />
    </linearGradient>
  </defs>

  <!-- App Icon Base -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#bgGrad)" stroke="#2563eb" stroke-width="2" />

  <!-- Motion/Action Details -->
  <path d="M 45 25 Q 50 20 54 26" stroke="#eff6ff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 52 78 Q 44 80 34 76" stroke="#eff6ff" stroke-width="2" stroke-linecap="round" fill="none"/>
  <line x1="12" y1="50" x2="12" y2="65" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="12" y1="40" x2="12" y2="44" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Net Bag / Mesh -->
  <path d="M 56 36 C 80 32, 90 55, 84 75 C 75 80, 56 70, 56 70 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2" opacity="0.8"/>
  <!-- Basic Grid Lines for the Net -->
  <path d="M 64 35 Q 75 45 76 74" stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 72 37 Q 85 45 84 66" stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 56 46 Q 70 42 85 46" stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 60 56 Q 75 52 86 60" stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 64 65 Q 75 62 82 72" stroke="#1d4ed8" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Net Handle -->
  <line x1="56" y1="70" x2="48" y2="95" stroke="#eab308" stroke-width="8" stroke-linecap="round" />
  
  <!-- Net Hoop Back Half (under the envelope) -->
  <ellipse cx="56" cy="53" rx="10" ry="24" transform="rotate(24 56 53)" fill="url(#hoopGrad)" stroke="#1d4ed8" stroke-width="2.5"/>
  <ellipse cx="56" cy="53" rx="5" ry="20" transform="rotate(24 56 53)" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Top Wing (Back Wing) -->
  <path d="M 34 38 Q 28 30 20 30 Q 18 36 24 38 Q 20 40 22 42 Z" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Envelope Body -->
  <g transform="translate(20, 36) rotate(-18)">
    <rect x="0" y="0" width="38" height="26" rx="2" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" />
    <path d="M 0 0 L 19 14 L 38 0" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <!-- Bottom Wing (Front Wing) -->
  <path d="M 28 58 Q 16 58 12 56 Q 16 66 22 66 Q 20 70 28 66 Z" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Net Hoop Front Arc (to make envelope look like it's inside) -->
  <path d="M 64.5 35 A 10 24 0 0 1 54 74" transform="rotate(24 56 53)" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <path d="M 62 36 A 5 20 0 0 1 52 70" transform="rotate(24 56 53)" fill="none" stroke="#f59e0b" stroke-width="1.5"/>

</svg>